<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whistleblowing | Renewable Energy Venture</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"><style>

</style><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet"></head><body data-locale="en" data-locale-root="locales" data-page-key="whistleblowing" data-active-parent="whistleblowing" data-alt-pt="pt/" data-alt-en="en/"><div data-site-partial="header" data-site-partial-src="whistle-header.html"></div><main class="whistle-page"><div class="whistle-card"><a href="en/index.html">← Home</a><p class="text-uppercase mt-4 mb-2">Confidential reporting channel</p><h1>New whistleblowing submission</h1><p class="whistle-intro">Submit a concern confidentially. You can follow up using the token provided after submission. Keep it safe.</p><form id="reportForm"><label class="form-label">Who is making the report? <span class="required">*</span></label><select class="form-select" name="reporterType" required><option value="">Choose one</option><option>I am a consumer or shareholder</option><option>I am an employee or ex-employee with concerns</option><option>Someone I know well witnessed wrongdoing at work</option><option>Someone I know well is committing wrongdoing at work</option><option>I want to report wrongdoing on behalf of my employer</option></select>
<label class="form-label">Please provide a brief outline of the issue <span class="required">*</span></label><textarea class="form-control" name="outline" rows="4" required maxlength="5000"></textarea><label class="form-label">Names and/or designation of people involved <span class="required">*</span></label><textarea class="form-control" name="people" rows="2" required></textarea><label class="form-label">Time period of the issue</label><input class="form-control" name="timePeriod" maxlength="500"><label class="form-label">Is the alleged conduct still ongoing? <span class="required">*</span></label><select class="form-select" name="ongoing" required><option value="">Choose one</option><option>Yes</option><option>No</option><option>Don't know</option></select><label class="form-label">Links to documents, photographs or other proofs</label><textarea class="form-control" name="proofLinks" rows="2" placeholder="Paste links (one per line)"></textarea><label class="form-label">What is the nature of your information? <span class="required">*</span></label><select class="form-select" name="informationNature" required><option value="">Choose one</option><option>I heard/saw it myself</option><option>I heard people talking about it</option></select><label class="form-label">Names of superiors you have communicated this with beforehand, if any</label><textarea class="form-control" name="superiors" rows="2"></textarea><label class="form-label">Email (optional, for token and response notifications)</label><input class="form-control" name="email" type="email" autocomplete="email"><div class="form-check mt-4"><input class="form-check-input" type="checkbox" name="policyAware" required><label class="form-check-label">I confirm that I have read and understood the organization’s Whistleblowing Policy. <span class="required">*</span></label></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="truthful" required><label class="form-check-label">I declare that, to the best of my knowledge, the information is true and submitted voluntarily. <span class="required">*</span></label></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="acknowledged" required><label class="form-check-label">I understand that the information may be used during investigation and reporting, and my identity may be disclosed where required by law, regulators or judicial proceedings. <span class="required">*</span></label></div><input type="text" name="company" class="d-none" tabindex="-1" autocomplete="off"><button class="btn btn-primary mt-4" type="submit">Submit report</button></form><div id="reportResult" class="whistle-status" role="status"></div>
<p class="mt-4"><a href="whistleblowing.html">Back to whistleblowing information</a></p></div></main><div data-site-partial="footer" data-site-partial-src="whistle-footer.html"></div><a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js" defer></script><script src="https://unpkg.com/i18next@23.16.8/dist/umd/i18next.min.js" defer></script><script src="js/site-i18n.js" defer></script><script src="api/public-config.php"></script><script src="js/config.js"></script><script>const api=async(p,o={})=>{let r;try{r=await fetch((window.apiUrl?window.apiUrl(p):'/api/'+p),{headers:{'Content-Type':'application/json'},...o})}catch(e){throw Error('We could not reach the reporting service. This is a technical connection problem, not a token error. Check your connection and try again. If it continues, contact the organization through another channel.')}let d;try{d=await r.json()}catch(e){throw Error('The reporting service returned an unreadable response (HTTP '+r.status+'). Please try again later or contact the organization.')}if(!r.ok){if(r.status===404&&d.error==='not_found'&&p.startsWith('whistleblowing/conversation'))throw Error('Conversation not found. Check that you entered the full token exactly as provided, without spaces. If you received it by email, check that message. If you no longer have the token, it cannot be recovered here; contact the organization through another channel or submit a new report.');if(r.status>=500)throw Error('A technical problem occurred on the reporting service (HTTP '+r.status+'). Your token was not confirmed. Please try again later; if the problem continues, contact the organization.');throw Error(d.message||'Request failed (HTTP '+r.status+').')}return d};const form=document.querySelector('#reportForm'),result=document.querySelector('#reportResult');form.addEventListener('submit',async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));['policyAware','truthful','acknowledged'].forEach(k=>d[k]=form.elements[k].checked);try{let r=await api('whistleblowing',{method:'POST',body:JSON.stringify(d)});result.innerHTML='<div class="alert alert-success">Report received. Your follow-up token: <strong></strong><p></p></div>';result.querySelector('strong').textContent=r.token;result.querySelector('p').textContent=d.email?(r.emailSent?'The token email was accepted for delivery. Check your inbox and spam folder, and save the token somewhere safe.':'We could not send the token email. Save this token now; it cannot be recovered later.'):'Save this token now; it cannot be recovered later.';form.reset()}catch(x){result.innerHTML='<div class="alert alert-danger"></div>';result.querySelector('.alert').textContent=x.message}});</script></body></html>
