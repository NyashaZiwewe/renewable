<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whistleblowing | Renewable Energy Venture</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/whistleblowing.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet"></head><body data-locale="en" data-locale-root="locales" data-page-key="whistleblowing" data-active-parent="whistleblowing" data-alt-pt="pt/nova-denuncia.html" data-alt-en="whistleblowing-submit.html"><div data-site-partial="header" data-site-partial-src="whistle-header.html"></div><main class="whistle-page"><div class="whistle-card"><a href="en/index.html">← Home</a><p class="text-uppercase mt-4 mb-2">Confidential reporting channel</p><h1>New whistleblowing submission</h1><p class="whistle-intro">Submit a concern confidentially. You can follow up using the token provided after submission. Keep it safe.</p><form id="reportForm"><label for="reporterType" class="form-label">Who is making the report? <span class="required">*</span></label><select class="form-select" name="reporterType" id="reporterType" required><option value="">Choose one</option><option>I am a consumer or shareholder</option><option>I am an employee or ex-employee with concerns</option><option>Someone I know well witnessed wrongdoing at work</option><option>Someone I know well is committing wrongdoing at work</option><option>I want to report wrongdoing on behalf of my employer</option></select>
<label for="outline" class="form-label">Please provide a brief outline of the issue <span class="required">*</span></label><textarea class="form-control" name="outline" id="outline" rows="4" required maxlength="5000"></textarea><label for="people" class="form-label">Names and/or designation of people involved <span class="required">*</span></label><textarea class="form-control" name="people" id="people" rows="2" required></textarea><label for="timePeriod" class="form-label">Time period of the issue</label><input class="form-control" name="timePeriod" id="timePeriod" maxlength="500"><label for="ongoing" class="form-label">Is the alleged conduct still ongoing? <span class="required">*</span></label><select class="form-select" name="ongoing" id="ongoing" required><option value="">Choose one</option><option>Yes</option><option>No</option><option>Don't know</option></select><label for="proofLinks" class="form-label">Links to documents, photographs or other proofs</label><textarea class="form-control" name="proofLinks" id="proofLinks" rows="2" placeholder="Paste links (one per line)"></textarea><label for="informationNature" class="form-label">What is the nature of your information? <span class="required">*</span></label><select class="form-select" name="informationNature" id="informationNature" required><option value="">Choose one</option><option>I heard/saw it myself</option><option>I heard people talking about it</option></select><label for="superiors" class="form-label">Names of superiors you have communicated this with beforehand, if any</label><textarea class="form-control" name="superiors" id="superiors" rows="2"></textarea><label for="email" class="form-label">Email (optional, for token and response notifications)</label><input class="form-control" name="email" id="email" type="email" autocomplete="email"><div class="form-check mt-4"><input class="form-check-input" id="policyAware" type="checkbox" name="policyAware" required><label for="policyAware" class="form-check-label">I confirm that I have read and understood the organization’s Whistleblowing Policy. <span class="required">*</span></label></div><div class="form-check mt-3"><input class="form-check-input" id="truthful" type="checkbox" name="truthful" required><label for="truthful" class="form-check-label">I declare that, to the best of my knowledge, the information is true and submitted voluntarily. <span class="required">*</span></label></div><div class="form-check mt-3"><input class="form-check-input" id="acknowledged" type="checkbox" name="acknowledged" required><label for="acknowledged" class="form-check-label">I understand that the information may be used during investigation and reporting, and my identity may be disclosed where required by law, regulators or judicial proceedings. <span class="required">*</span></label></div><input type="text" name="company" class="d-none" tabindex="-1" autocomplete="off"><button class="btn btn-primary mt-4" type="submit">Submit report</button></form><div id="reportResult" class="whistle-status" role="status"></div>
<p class="mt-4"><a href="whistleblowing.html">Back to whistleblowing information</a></p></div></main><div data-site-partial="footer" data-site-partial-src="whistle-footer.html"></div><a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js" defer></script><script src="https://unpkg.com/i18next@23.16.8/dist/umd/i18next.min.js" defer></script><script src="js/site-i18n.js" defer></script><script src="api/public-config.php"></script><script src="js/config.js"></script><script src="js/whistleblowing.js" defer></script></body></html>
