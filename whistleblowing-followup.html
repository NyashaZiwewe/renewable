<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whistleblowing | Renewable Energy Venture</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"><style>
.whistle-page{max-width:900px;margin:4rem auto;padding:0 1rem}.whistle-card{background:#fff;border-radius:16px;padding:clamp(1.25rem,4vw,3rem);box-shadow:0 12px 40px #1232}.whistle-page h1{color:#174d3a}.whistle-page .form-label{font-weight:600;margin-top:1rem}.whistle-page .required{color:#a22}.whistle-status{margin-top:1rem}.whistle-message{padding:1rem;border-radius:10px;background:#f2f6f3;margin:.6rem 0;white-space:pre-wrap}.whistle-message.admin{background:#e5f1e9}.whistle-message time{display:block;color:#566;font-size:.85rem;margin:.25rem 0}.whistle-intro{color:#556}
</style><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet"></head><body data-locale="en" data-locale-root="locales" data-page-key="whistleblowing" data-active-parent="whistleblowing" data-alt-pt="pt/" data-alt-en="en/"><div data-site-partial="header" data-site-partial-src="whistle-header.html"></div><main class="whistle-page"><div class="whistle-card"><a href="en/index.html">← Home</a><p class="text-uppercase mt-4 mb-2">Confidential reporting channel</p><h1>Follow up on a report</h1><p class="whistle-intro">Enter the follow-up token you received after submitting your report to read or send messages.</p><form id="tokenForm" class="row g-2"><div class="col"><input class="form-control" name="token" placeholder="Follow-up token" required></div><div class="col-auto"><button class="btn btn-outline-primary">Open conversation</button></div></form><div id="conversation"></div><p class="mt-4"><a href="whistleblowing.html">Back to whistleblowing information</a></p></div></main><div data-site-partial="footer" data-site-partial-src="whistle-footer.html"></div><a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js" defer></script><script src="https://unpkg.com/i18next@23.16.8/dist/umd/i18next.min.js" defer></script><script src="js/site-i18n.js" defer></script><script src="api/public-config.php"></script><script src="js/config.js"></script><script>const api=async(p,o={})=>{let r;try{r=await fetch((window.apiUrl?window.apiUrl(p):'/api/'+p),{headers:{'Content-Type':'application/json'},...o})}catch(e){throw Error('We could not reach the reporting service. This is a technical connection problem, not a token error. Check your connection and try again. If it continues, contact the organization through another channel.')}let d;try{d=await r.json()}catch(e){throw Error('The reporting service returned an unreadable response (HTTP '+r.status+'). Please try again later or contact the organization.')}if(!r.ok){if(r.status===404&&d.error==='not_found'&&p.startsWith('whistleblowing/conversation'))throw Error('Conversation not found. Check that you entered the full token exactly as provided, without spaces. If you received it by email, check that message. If you no longer have the token, it cannot be recovered here; contact the organization through another channel or submit a new report.');if(r.status>=500)throw Error('A technical problem occurred on the reporting service (HTTP '+r.status+'). Your token was not confirmed. Please try again later; if the problem continues, contact the organization.');throw Error(d.message||'Request failed (HTTP '+r.status+').')}return d};let activeToken='';function renderChat(data){const root=document.querySelector('#conversation');root.replaceChildren();const status=document.createElement('p');status.textContent='Status: '+data.status;root.append(status);(data.messages||[]).forEach(message=>{const item=document.createElement('div');item.className='whistle-message '+(message.from==='admin'?'admin':'');const sender=document.createElement('strong');sender.textContent=message.from==='admin'?'Organization':'You';const time=document.createElement('time');time.dateTime=message.createdAt||'';const date=new Date(message.createdAt);time.textContent=Number.isNaN(date.getTime())?String(message.createdAt||'Date unavailable'):date.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});const body=document.createElement('div');body.textContent=message.body||'';item.append(sender,time,body);root.append(item)});const form=document.createElement('form');form.id='replyForm';const field=document.createElement('textarea');field.className='form-control';field.name='message';field.required=true;field.rows=3;field.placeholder='Write a follow-up';const send=document.createElement('button');send.className='btn btn-primary mt-2';send.textContent='Send message';form.append(field,send);root.append(form);form.onsubmit=async event=>{event.preventDefault();send.disabled=true;try{await api('whistleblowing/conversation',{method:'POST',body:JSON.stringify({token:activeToken,message:field.value})});loadChat()}catch(error){send.disabled=false;alert(error.message)}}}async function loadChat(){try{renderChat(await api('whistleblowing/conversation?token='+encodeURIComponent(activeToken)))}catch(x){document.querySelector('#conversation').textContent=x.message}}document.querySelector('#tokenForm').onsubmit=e=>{e.preventDefault();activeToken=new FormData(e.target).get('token');loadChat()};</script></body></html>
