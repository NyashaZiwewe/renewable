<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Whistleblowing inbox</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css?v=shared-sidebar">
    <style>
        .report{padding:1.25rem;border:1px solid #ddd;border-radius:12px;margin:1rem 0;background:#fff}.report h2{color:#174d3a}.report-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem 1.5rem}.report-details p{margin:0;white-space:pre-wrap}.msg{padding:.8rem 1rem;background:#f1f5f2;margin:.65rem 0;border-radius:10px;white-space:pre-wrap}.msg.admin{background:#e5f1e9}.msg time{display:block;color:#59665e;font-size:.85rem;margin:.25rem 0}.reply{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}.reply textarea{flex:1 1 100%;min-height:100px}.issue-actions{display:flex;gap:.7rem;align-items:center;margin:1rem 0}.status-pill{display:inline-block;padding:.25rem .7rem;border-radius:99px;background:#edf2ee}.status-pill.closed{background:#f5e5e5;color:#7c2525}.empty{padding:1rem;background:#f5f7f5;border-radius:8px}
    </style>
</head>
<body class="admin-dashboard" data-admin-page="whistleblowing">
<main class="admin-main">
    <div id="status" role="status">Loading reports…</div>
    <div id="reports"></div>
</main>
<script src="../js/config.js" defer></script>
<script src="../js/admin-whistleblowing.js" defer></script>
<script src="../js/admin.js?v=shared-sidebar" defer></script>
</body>
</html>
