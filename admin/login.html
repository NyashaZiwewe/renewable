<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin login | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body class="admin-auth" data-admin-page="login">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="login-title">
            <p class="auth-kicker">Admin</p>
            <h1 id="login-title">Sign in</h1>
            <form id="loginForm" class="admin-form" novalidate>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                    Sign in
                </button>
                <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
            </form>
            <a href="forgot-password.html" class="auth-link">Forgot password?</a>
        </section>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js" defer></script>
</body>
</html>
