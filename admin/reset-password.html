<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Set new password | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body class="admin-auth" data-admin-page="reset">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="reset-title">
            <p class="auth-kicker">Admin</p>
            <h1 id="reset-title">Set new password</h1>
            <form id="resetForm" method="post" class="admin-form" novalidate>
                <label for="newPassword">New password</label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" required>
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-key" aria-hidden="true"></i>
                    Update password
                </button>
                <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
            </form>
            <a href="login.html" class="auth-link">Back to sign in</a>
        </section>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js" defer></script>
</body>
</html>
