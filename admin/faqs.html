<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FAQ admin | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body class="admin-dashboard" data-admin-page="faqs">
    <header class="admin-topbar">
        <h1>Frequently asked questions</h1>
        <div class="admin-session">
            <span id="adminEmail"></span>
            <button id="logoutButton" class="btn btn-dark btn-sm" type="button">Log out</button>
        </div>
    </header>
    <main class="admin-main">
        <a href="index.html">Back to dashboard</a>
        <div class="mt-3 mb-3">
            <label class="form-label" for="faqLocale">Language</label>
            <select id="faqLocale" class="form-select w-auto" disabled>
                <option value="en">English</option>
                <option value="pt">Portuguese</option>
            </select>
        </div>
        <p id="faqStatus" class="form-status" role="status" aria-live="polite"></p>
        <div class="row g-4">
            <section class="col-lg-6">
                <div class="admin-card">
                    <div class="section-heading">
                        <h2 id="faqEditorHeading">New FAQ</h2>
                        <button id="newFaq" class="btn btn-outline-primary" type="button" disabled>New FAQ</button>
                    </div>
                    <form id="faqForm">
                        <fieldset id="faqFields" class="admin-form" disabled>
                            <label for="faqQuestion">Question</label>
                            <input id="faqQuestion" name="question" maxlength="300" required>
                            <label for="faqAnswer">Answer</label>
                            <textarea id="faqAnswer" name="answer" rows="6" maxlength="5000" required></textarea>
                            <button type="submit" class="btn btn-primary mt-3">Save FAQ</button>
                        </fieldset>
                    </form>
                </div>
            </section>
            <section class="col-lg-6">
                <div class="admin-card">
                    <h2>Published FAQs</h2>
                    <div id="faqList"></div>
                </div>
            </section>
        </div>
        <dialog id="faqDeleteDialog" class="border-0 rounded shadow p-4" aria-labelledby="faqDeleteTitle" aria-describedby="faqDeleteQuestion faqDeleteDescription">
            <h2 id="faqDeleteTitle" class="h4">Delete this FAQ?</h2>
            <p id="faqDeleteQuestion" class="text-break"></p>
            <p id="faqDeleteDescription">This will remove it from the public FAQ page.</p>
            <form method="dialog" class="d-flex flex-wrap gap-2">
                <button type="submit" value="cancel" class="btn btn-outline-secondary" autofocus>Cancel</button>
                <button type="submit" value="delete" class="btn btn-danger">Delete FAQ</button>
            </form>
        </dialog>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js?v=faqs" defer></script>
</body>
</html>
