<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reset password | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body class="admin-auth" data-admin-page="forgot">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="forgot-title">
            <p class="auth-kicker">Admin</p>
            <h1 id="forgot-title">Reset password</h1>
            <p class="auth-copy">Enter the admin email address. If it exists, a reset link will be sent.</p>
            <form id="forgotForm" method="post" class="admin-form" novalidate>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-envelope" aria-hidden="true"></i>
                    Send reset link
                </button>
                <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
            </form>
            <a href="login.html" class="auth-link">Back to sign in</a>
        </section>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js" defer></script>
</body>
</html>
