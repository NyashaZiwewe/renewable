<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css?v=shared-sidebar" rel="stylesheet">
</head>
<body class="admin-dashboard" data-admin-page="company">
    <main class="admin-main">
        <form id="companyForm" class="admin-card admin-single-card"><p id="companyStatus" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" class="form-status company-status mb-3"></p><p>Leave social links empty to show icons linking to #. Configured links open in a new tab.</p><div class="mb-3"><label class="form-label" for="company-name">Company name</label><input class="form-control" id="company-name" name="name" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-motto">Motto</label><input class="form-control" id="company-motto" name="motto" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-logo">Logo URL</label><input class="form-control" id="company-logo" name="logo" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-address">Physical address</label><input class="form-control" id="company-address" name="address" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-mapLocation">Map location</label><input class="form-control" id="company-mapLocation" name="mapLocation" type="text" maxlength="1000" aria-describedby="mapLocationHelp"><small id="mapLocationHelp" class="form-text">Enter an exact address, place name, or latitude and longitude. Leave blank to use the physical address. If neither is set, the map shows Mozambique.</small></div><div class="mb-3"><label class="form-label" for="company-phone">Phone number (calls, with country code)</label><input class="form-control" id="company-phone" name="phone" type="tel" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-whatsapp">WhatsApp number (with country code)</label><input class="form-control" id="company-whatsapp" name="whatsapp" type="tel" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-facebook">Facebook URL</label><input class="form-control" id="company-facebook" name="facebook" type="url" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-linkedin">Linkedin URL</label><input class="form-control" id="company-linkedin" name="linkedin" type="url" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-youtube">Youtube URL</label><input class="form-control" id="company-youtube" name="youtube" type="url" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-twitter">Twitter URL</label><input class="form-control" id="company-twitter" name="twitter" type="url" maxlength="1000"></div><div class="mb-3"><label for="companyLogoFile">Upload logo (JPEG, PNG, GIF or WebP, up to 5 MB)</label><input id="companyLogoFile" type="file" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp"><button id="uploadCompanyLogo" type="button" class="btn btn-outline-primary mt-2">Upload logo</button></div><button class="btn btn-primary" type="submit">Save company settings</button></form>
    </main>

    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js?v=shared-sidebar" defer></script>
</body>
</html>
