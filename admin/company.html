<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css?v=admin-error-red-3" rel="stylesheet">
</head>
<body class="admin-dashboard" data-admin-page="company">
    <header class="admin-topbar">
        <div>
            <p class="auth-kicker">Admin</p>
            <h1>Company settings</h1>
        </div>
        <div class="admin-session">
            <span id="adminEmail"></span>
            <a class="btn btn-outline-primary btn-sm" href="../en/" target="_blank" rel="noopener">
                <i class="bi bi-eye" aria-hidden="true"></i>
                View site
            </a>
            <button id="logoutButton" class="btn btn-dark btn-sm" type="button">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                Log out
            </button>
        </div>
    </header>

    <main class="admin-main">
<a href="index.html">Back to dashboard</a><form id="companyForm" class="mt-4"><p id="companyStatus" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" class="form-status company-status mb-3"></p><p>Leave social links empty to show icons linking to #. Configured links open in a new tab.</p><div class="mb-3"><label class="form-label" for="company-name">Company name</label><input class="form-control" id="company-name" name="name" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-motto">Motto</label><input class="form-control" id="company-motto" name="motto" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-logo">Logo URL</label><input class="form-control" id="company-logo" name="logo" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-address">Physical address</label><input class="form-control" id="company-address" name="address" type="text" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-mapLocation">Map location</label><input class="form-control" id="company-mapLocation" name="mapLocation" type="text" maxlength="1000" aria-describedby="mapLocationHelp"><small id="mapLocationHelp" class="form-text">Enter an exact address, place name, or latitude and longitude. Leave blank to use the physical address. If neither is set, the map shows Mozambique.</small></div><div class="mb-3"><label class="form-label" for="company-phone">Phone number (calls, with country code)</label><input class="form-control" id="company-phone" name="phone" type="tel" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-whatsapp">WhatsApp number (with country code)</label><input class="form-control" id="company-whatsapp" name="whatsapp" type="tel" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-facebook">Facebook URL</label><input class="form-control" id="company-facebook" name="facebook" type="url" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-linkedin">Linkedin URL</label><input class="form-control" id="company-linkedin" name="linkedin" type="url" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-youtube">Youtube URL</label><input class="form-control" id="company-youtube" name="youtube" type="url" maxlength="1000"></div><div class="mb-3"><label class="form-label" for="company-twitter">Twitter URL</label><input class="form-control" id="company-twitter" name="twitter" type="url" maxlength="1000"></div><div class="mb-3"><label for="companyLogoFile">Upload logo (JPEG, PNG, GIF or WebP, up to 5 MB)</label><input id="companyLogoFile" type="file" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp"><button id="uploadCompanyLogo" type="button" class="btn btn-outline-primary mt-2">Upload logo</button></div><button class="btn btn-primary" type="submit">Save company settings</button></form>    </main>

    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js?v=company-logo-preservation" defer></script>
</body>
</html>
