<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Products admin | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css?v=shared-sidebar" rel="stylesheet">
</head>
<body class="admin-dashboard" data-admin-page="products">
    <main class="admin-layout">
        <section class="admin-card editor-card" aria-labelledby="product-editor-title">
            <div class="section-heading">
                <div>
                    <p class="auth-kicker">Products</p>
                    <h2 id="product-editor-title">New product</h2>
                </div>
                <button id="newProductButton" class="btn btn-outline-primary btn-sm" type="button">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                    New
                </button>
            </div>

            <form id="productForm" class="admin-form" novalidate>
                <input id="productId" name="productId" type="hidden">
                <div class="form-grid">
                    <div>
                        <label for="productLocale">Language</label>
                        <select id="productLocale" name="locale" required>
                            <option value="en">English</option>
                            <option value="pt">Portuguese</option>
                        </select>
                    </div>
                    <div>
                        <label for="productStatus">Status</label>
                        <select id="productStatus" name="status" required>
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                </div>

                <label for="productName">Name</label>
                <input id="productName" name="name" type="text" maxlength="160" required>

                <label for="productDescription">Description</label>
                <textarea id="productDescription" name="description" rows="5" maxlength="2000" required></textarea>

                <div class="form-grid">
                    <div>
                        <label for="productAvailability">Availability</label>
                        <select id="productAvailability" name="availability" required>
                            <option value="available">Available</option>
                            <option value="limited">Limited stock</option>
                            <option value="out_of_stock">Out of stock</option>
                            <option value="coming_soon">Coming soon</option>
                        </select>
                    </div>
                    <div>
                        <label for="productCurrency">Currency</label>
                        <select id="productCurrency" name="currency" required>
                            <option value="MZN" selected>MZN — Mozambican metical</option>
                            <option value="USD">USD — US dollar</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div>
                        <label for="productPrice">New price</label>
                        <input id="productPrice" name="price" type="number" min="0" step="0.01" required>
                    </div>
                    <div>
                        <label for="productOldPrice">Old price</label>
                        <input id="productOldPrice" name="oldPrice" type="number" min="0" step="0.01" placeholder="Optional">
                    </div>
                </div>

                <div class="product-properties-editor">
                    <div class="section-heading">
                        <div>
                            <label>Product properties</label>
                            <small>Add up to five details, such as size, shape or color.</small>
                        </div>
                        <button id="addProductPropertyButton" class="btn btn-outline-primary btn-sm" type="button">Add property</button>
                    </div>
                    <div id="productProperties" class="product-property-rows"></div>
                </div>

                <label for="productImageFile">Image</label>
                <div class="image-upload-control">
                    <input id="productImageFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
                    <input id="productImageUrl" name="imageUrl" type="text" placeholder="/img/example.jpg or https://...">
                </div>
                <div id="productImagePreview" class="image-preview" aria-live="polite"></div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-save" aria-hidden="true"></i>
                        Save product
                    </button>
                    <button id="deleteProductButton" class="btn btn-outline-danger" type="button" hidden>
                        <i class="bi bi-trash" aria-hidden="true"></i>
                        Delete
                    </button>
                </div>
                <p id="productStatusMessage" class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <aside class="admin-stack">
            <section class="admin-card" aria-labelledby="products-list-title">
                <div class="section-heading">
                    <div>
                        <p class="auth-kicker">Catalogue</p>
                        <h2 id="products-list-title">Saved products</h2>
                    </div>
                    <button id="refreshProductsButton" class="btn btn-outline-primary btn-sm" type="button">
                        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                        Refresh
                    </button>
                </div>
                <div id="productsList" class="article-list" aria-live="polite"></div>
            </section>
        </aside>
    </main>

    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js?v=shared-sidebar" defer></script>
</body>
</html>
