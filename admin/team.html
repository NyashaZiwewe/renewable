<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Team admin | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css?v=20261123-images" rel="stylesheet">
</head>
<body class="admin-dashboard" data-admin-page="team">
    <main class="admin-main">

        <div class="admin-card mt-4">
            <label for="teamLocale">Language</label>
            <select id="teamLocale" class="form-select"><option value="en">English</option><option value="pt">Portuguese</option></select>
            <p class="mt-2">Manage each language separately. Profiles appear in the order below. Drafts stay private.</p>
            <form id="teamIntroForm" class="admin-form mt-3">
                <label for="teamIntro">Team and culture introduction</label>
                <textarea id="teamIntro" rows="5" maxlength="5000"></textarea>
                <button type="submit" class="btn btn-primary mt-3">Save introduction</button>
            </form>
        </div>
        <div class="row g-4 mt-1">
            <section class="col-lg-6"><div class="admin-card">
                <div class="section-heading"><h2 id="teamEditorHeading">New team member</h2><button type="button" id="newTeamMember" class="btn btn-outline-primary">New member</button></div>
                <form id="teamMemberForm" class="admin-form">
                    <input type="hidden" id="teamMemberId">
                    <label for="teamMemberName">Full name</label><input id="teamMemberName" name="name" maxlength="160" required>
                    <label for="teamMemberTitle">Title / role</label><input id="teamMemberTitle" name="title" maxlength="160" required>
                    <label for="teamMemberSummary">Professional summary</label><textarea id="teamMemberSummary" name="summary" rows="8" maxlength="5000" required></textarea>
                    <label for="teamMemberImage">Direct portrait image URL (optional)</label><input id="teamMemberImage" name="imageUrl" maxlength="2048">
                    <div id="teamPortraitPreview" class="image-preview" aria-live="polite"></div>
                    <label for="teamMemberFile">Upload portrait (JPEG, PNG, GIF or WebP, up to 5 MB)</label><input id="teamMemberFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
                    <button id="uploadTeamPortrait" type="button" class="btn btn-outline-primary mt-2">Upload portrait</button>
                    <label for="teamMemberStatus">Status</label><select id="teamMemberStatus" name="status"><option value="draft">Draft</option><option value="published">Published</option></select>
                    <button type="submit" class="btn btn-primary mt-3">Save member</button>
                    <button id="deleteTeamMember" type="button" class="btn btn-outline-danger mt-3" hidden>Delete member</button>
                </form>
            </div></section>
            <section class="col-lg-6"><div class="admin-card"><h2>Team members</h2><div id="teamMembersList"></div></div></section>
        </div>
        <p id="teamAdminStatus" role="status" class="mt-3"></p>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js?v=20261123-images" defer></script>
</body>
</html>
