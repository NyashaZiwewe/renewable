<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Change password | Mozambique Renewable Energy Venture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
</head>
<body class="admin-dashboard" data-admin-page="password">
    <header class="admin-topbar">
        <div>
            <p class="auth-kicker">Admin</p>
            <h1>Change password</h1>
        </div>
        <div class="admin-session">
            <nav class="admin-nav" aria-label="Admin navigation">
                <a href="articles.html">Articles</a>
                <a href="products.html">Products</a>
                <a href="leads.html">Queries</a>
                <a class="active" href="change-password.html">Password</a>
            </nav>
            <span id="adminEmail"></span>
            <a class="btn btn-outline-primary btn-sm" href="../en/" target="_blank" rel="noopener">
                <i class="bi bi-eye" aria-hidden="true"></i>
                View site
            </a>
            <button id="logoutButton" class="btn btn-dark btn-sm" type="button">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                Log out
            </button>
        </div>
    </header>

    <main class="admin-main">
        <a href="index.html">Back to dashboard</a>
        <section class="admin-card admin-single-card" aria-labelledby="password-title">
            <p class="auth-kicker">Security</p>
            <h2 id="password-title">Change password</h2>
            <form id="changePasswordForm" method="post" class="admin-form compact-form" novalidate>
                <label for="currentPassword">Current password</label>
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
                <label for="newPassword">New password</label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" required>
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
                <button class="btn btn-dark w-100" type="submit">
                    <i class="bi bi-shield-lock" aria-hidden="true"></i>
                    Change password
                </button>
                <p id="passwordStatus" class="form-status" role="status" aria-live="polite"></p>
            </form>
            <a class="auth-link" href="forgot-password.html">Reset password by email</a>
        </section>
    </main>

    <script src="../js/config.js" defer></script>
    <script src="../js/admin.js" defer></script>
</body>
</html>
