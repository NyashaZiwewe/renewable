<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncia confidencial | Renewable Energy Venture</title><link rel="stylesheet" href="../css/bootstrap.min.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/whistleblowing.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet"></head><body data-locale="pt" data-locale-root="../locales" data-page-key="whistleblowing" data-active-parent="whistleblowing" data-alt-pt="nova-denuncia.html" data-alt-en="../whistleblowing-submit.html"><div data-site-partial="header" data-site-partial-src="header.html"></div><main class="whistle-page"><div class="whistle-card"><a href="index.html">← Início</a><p class="text-uppercase mt-4 mb-2">Canal de denúncias confidenciais</p><h1>Apresentar uma nova denúncia</h1><p class="whistle-intro">Apresente a sua denúncia de forma confidencial. Após o envio, receberá um código para acompanhar a denúncia. Guarde-o num local seguro.</p><form id="reportForm"><label for="reporterType" class="form-label">Quem está a apresentar a denúncia? <span class="required">*</span></label><select class="form-select" name="reporterType" id="reporterType" required><option value="">Seleccione uma opção</option><option value="I am a consumer or shareholder">Sou consumidor ou accionista</option><option value="I am an employee or ex-employee with concerns">Sou trabalhador ou ex-trabalhador e pretendo comunicar uma suspeita</option><option value="Someone I know well witnessed wrongdoing at work">Uma pessoa que conheço bem testemunhou irregularidades no trabalho</option><option value="Someone I know well is committing wrongdoing at work">Uma pessoa que conheço bem está a cometer irregularidades no trabalho</option><option value="I want to report wrongdoing on behalf of my employer">Pretendo denunciar irregularidades em nome da minha entidade empregadora</option></select>
<label for="outline" class="form-label">Descreva brevemente a situação <span class="required">*</span></label><textarea class="form-control" name="outline" id="outline" rows="4" required maxlength="5000"></textarea><label for="people" class="form-label">Nomes e/ou cargos das pessoas envolvidas <span class="required">*</span></label><textarea class="form-control" name="people" id="people" rows="2" required></textarea><label for="timePeriod" class="form-label">Período em que a situação ocorreu</label><input class="form-control" name="timePeriod" id="timePeriod" maxlength="500"><label for="ongoing" class="form-label">A alegada conduta continua a ocorrer? <span class="required">*</span></label><select class="form-select" name="ongoing" id="ongoing" required><option value="">Seleccione uma opção</option><option value="Yes">Sim</option><option value="No">Não</option><option value="Don't know">Não sei</option></select><label for="proofLinks" class="form-label">Ligações para documentos, fotografias ou outras provas</label><textarea class="form-control" name="proofLinks" id="proofLinks" rows="2" placeholder="Cole as ligações (uma por linha)"></textarea><label for="informationNature" class="form-label">Como obteve esta informação? <span class="required">*</span></label><select class="form-select" name="informationNature" id="informationNature" required><option value="">Seleccione uma opção</option><option value="I heard/saw it myself">Ouvi ou vi directamente</option><option value="I heard people talking about it">Ouvi outras pessoas a falar sobre a situação</option></select><label for="superiors" class="form-label">Nomes dos superiores a quem já comunicou a situação, se aplicável</label><textarea class="form-control" name="superiors" id="superiors" rows="2"></textarea><label for="email" class="form-label">E-mail (opcional, para receber o código e avisos de resposta)</label><input class="form-control" name="email" id="email" type="email" autocomplete="email"><div class="form-check mt-4"><input class="form-check-input" id="policyAware" type="checkbox" name="policyAware" required><label for="policyAware" class="form-check-label">Confirmo que li e compreendi a Política de Denúncias da organização. <span class="required">*</span></label></div><div class="form-check mt-3"><input class="form-check-input" id="truthful" type="checkbox" name="truthful" required><label for="truthful" class="form-check-label">Declaro que, tanto quanto sei, as informações são verdadeiras e foram prestadas voluntariamente. <span class="required">*</span></label></div><div class="form-check mt-3"><input class="form-check-input" id="acknowledged" type="checkbox" name="acknowledged" required><label for="acknowledged" class="form-check-label">Compreendo que as informações podem ser utilizadas em investigações e relatórios e que a minha identidade pode ser revelada quando exigido por lei, por autoridades reguladoras ou no âmbito de processos judiciais. <span class="required">*</span></label></div><input type="text" name="company" class="d-none" tabindex="-1" autocomplete="off"><button class="btn btn-primary mt-4" type="submit">Enviar denúncia</button></form><div id="reportResult" class="whistle-status" role="status"></div>
<p class="mt-4"><a href="denuncias.html">Voltar às informações sobre denúncias</a></p></div></main><div data-site-partial="footer" data-site-partial-src="footer.html"></div><a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top" aria-label="Voltar ao topo"><i class="bi bi-arrow-up"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js" defer></script><script src="https://unpkg.com/i18next@23.16.8/dist/umd/i18next.min.js" defer></script><script src="../js/site-i18n.js" defer></script><script src="../api/public-config.php"></script><script src="../js/config.js"></script><script src="../js/whistleblowing.js" defer></script></body></html>
